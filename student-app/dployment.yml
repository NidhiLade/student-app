apiVersion: apps/v1
kind: Deployment

metadata:
  name: student-app-deployment

spec:
  replicas: 6

  selector:
    matchLabels:
      app: student-app

  template:
    metadata:
      labels:
        app: student-app

    spec:
      containers:
        - name: student-app-container
          image: student-app:v4
          imagePullPolicy: Never
          ports:
            - containerPort: 5000

